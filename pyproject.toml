requires-python = ">=3.13"
dependencies = [
    "hid>=1.0.8",
    "launchd-plist>=2020.12.3",
    "mido>=1.3.3",
    "pillow==12.0.0",
    "platformdirs>=4.5.1",
    "pyautogui>=0.9.54",
    "pyobjc>=12.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
]
